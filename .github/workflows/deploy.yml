name: Deploy dashboard to Droplet

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-dashboard-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy mi-paas-dashboard over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          password: ${{ secrets.DROPLET_PASSWORD }}
          script_stop: true
          command_timeout: 20m
          script: |
            # 1. Configurar rutas de NVM, Node y PM2
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$PATH:/usr/local/bin:/usr/bin:$HOME/.local/bin"
            if [ -d "$HOME/.nvm/versions/node" ]; then
              LATEST_NODE="$(ls "$HOME/.nvm/versions/node" 2>/dev/null | tail -n 1)"
              if [ -n "$LATEST_NODE" ]; then
                export PATH="$PATH:$HOME/.nvm/versions/node/$LATEST_NODE/bin"
              fi
            fi

            set -e
            cd ~

            # 2. Actualizar o clonar el código del repositorio
            if [ -d DEPLOY-YOUR-SYSTEM-NOW-2026/.git ]; then
              cd DEPLOY-YOUR-SYSTEM-NOW-2026
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/JDLBARRERA/DEPLOY-YOUR-SYSTEM-NOW-2026.git
              cd DEPLOY-YOUR-SYSTEM-NOW-2026
            fi

            # 3. Preparar e instalar Next.js
            cd mi-paas-dashboard
            cp ~/mi-paas/.env .env || true
            npm install

            # Limitar consumo de RAM para prevenir cierres por OOM
            NODE_OPTIONS="--max-old-space-size=1536" npm run build

            # 4. Reiniciar servicio en PM2
            pm2 restart paas-dashboard || pm2 start npm --name "paas-dashboard" -- run start -- -p 3000
            pm2 save || true
